spring.application.name=server

spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/estaciona_mais}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.baseline-on-migrate=true

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

jwt.secret=${JWT_SECRET}
jwt.expiracao-minutos=60

google.client-id=${GOOGLE_CLIENT_ID}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

app.front-url=${FRONT_URL:http://localhost:5173}
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173}

